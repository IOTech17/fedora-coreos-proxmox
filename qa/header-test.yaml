# Test header equivalent to the one generated by hook-fcos.sh (dummy values).
# Used by qa.sh and CI: cat qa/header-test.yaml fcos-base-tmplt.yaml | butane --strict
# Keep in sync with the YAML generation in hook-fcos.sh (version = BUTANE_SPEC_VERSION).

variant: fcos
version: 1.7.0

passwd:
  users:
    - name: "admin"
      gecos: "CoreOS Administrator"
      password_hash: '$y$j9T$qa$qaqaqaqaqaqaqaqaqaqaqaqaqaqaqaqaqaqaqaqaqa'
      groups: [ "sudo", "adm", "wheel", "systemd-journal" ]
      ssh_authorized_keys:
        - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIQAQAQAQAQAQAQAQAQAQAQAQAQAQAQAQAQAQAQAQ qa@example.com"

storage:
  disks:
    - device: /dev/disk/by-id/coreos-boot-disk
      wipe_table: false
      partitions:
        - number: 4
          label: root
          size_mib: 0
          resize: true
  files:
    - path: /etc/hostname
      mode: 0644
      overwrite: true
      contents:
        inline: |
          fcos-qa

    - path: /etc/NetworkManager/system-connections/net0.nmconnection
      mode: 0600
      overwrite: true
      contents:
        inline: |
          [connection]
          type=ethernet
          id=net0

          [ethernet]
          mac-address=bc:24:11:00:00:01

          [ipv4]
          method=manual
          addresses=192.0.2.10/255.255.255.0
          gateway=192.0.2.1
          dns=192.0.2.1
          dns-search=example.com

